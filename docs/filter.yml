apiRules:
- exclude:
    hasAttribute:
      uid: System.ObsoleteAttribute
- include:
    uidRegex: ^Harp\.SoundCard\.(AsyncDevice|CreateMessage|DeviceDataWriter|FilterRegister|Format|GetDeviceMetadata|GroupByRegister|Parse|ReadSoundMetadata|SampleRate|SoundMetadata|UpdateSoundWaveform)$
    type: Type
- exclude:
    uidRegex: ^Harp\.SoundCard\.[^.]+$
    type: Type
